# Версия API Kubernetes для контроллеров развертывания
apiVersion: apps/v1
# Тип ресурса: управляет подами и их обновлениями
kind: Deployment
# Метаданные самого объекта Deployment
metadata:
  # Метки (теги) для поиска и группировки объекта
  labels:
    # Произвольная пара ключ-значение для идентификации приложения
    app: fago-gateway
  # Уникальное имя этого Deployment в рамках namespace  
  name: gateway-deployment
  # Пространство имен
  namespace: fago
# Спецификация: желаемое состояние объекта  
spec:
  # Количество одновременно работающих копий (подов) приложения
  replicas: 1
  # Правило отбора подов, которыми управляет этот Deployment
  selector:
    # Искать поды по точному совпадению меток
    matchLabels:
      # Должно строго совпадать с labels в секции template ниже   
      app: fago-gateway
  # Шаблон, по которому Kubernetes будет создавать поды
  template:
    # Метаданные каждого создаваемого пода  
    metadata:
      # Метки, которые получат новые поды
      labels:
        # По этой метке под найдут Deployment и внешний Service
        app: fago-gateway
    # Спецификация внутренностей пода    
    spec:
      # Список контейнеров, запускаемых внутри пода
      containers:
        # Внутреннее имя контейнера
        - name: fago-gateway
          # Docker-образ и его тег (local/ указывает на локальную сборку)
          image: local/fago-gateway:v1
          # Скачивать образ, только если его еще нет локально на узле
          imagePullPolicy: IfNotPresent
          # Список портов, которые открывает приложение в контейнере
          ports:
            # Информационный порт, который слушает приложение внутри
            - containerPort: 8080
          # Переменные окружения, передаваемые внутрь контейнера  
          env:
            # Имя переменной окружения
            - name: SERVICE_URL
              # Внутренний DNS-адрес бэкенда в том же namespace
              value: "http://service-service:8001"
          # Управление вычислительными ресурсами (CPU и RAM)    
          resources:
            # Гарантированный минимум ресурсов для запуска пода на узле
            requests:
              # 50 милликор (0.05 процессорного ядра)
              cpu: "50m"
              # 64 мегабайта оперативной памяти
              memory: "64Mi"
            # Потолок потребления ресурсов контейнером  
            limits:
              # Максимум 0.25 ядра (при превышении — искусственное замедление)
              cpu: "250m"
              # Максимум 128 MiB (при превышении — перезапуск с ошибкой OOMKilled)
              memory: "128Mi"
          # Проверка готовности принимать трафик от Service    
          readinessProbe:
            # Тип проверки: отправка HTTP GET-запроса
            httpGet:
              # Путь эндпоинта проверки здоровья в приложении
              path: /health
              # Порт, на который отправляется проверочный запрос
              port: 8080
            # Задержка перед первой проверкой после старта контейнера (сек)  
            initialDelaySeconds: 2
            # Интервал между проверками готовности (сек)
            periodSeconds: 5
          # Проверка жизнеспособности (если упадет — контейнер перезапустят)  
          livenessProbe:
            # Тип проверки: отправка HTTP GET-запроса
            httpGet:
              # Путь эндпоинта проверки жизнеспособности 
              path: /health
              # Порт для отправки запроса
              port: 8080
            # Задержка перед первой проверкой после старта (сек)  
            initialDelaySeconds: 5
            # Интервал между проверками жизнеспособности (сек)
            periodSeconds: 10